name: Atualizar dados e publicar

on:
  schedule:
    # Uma vez por dia, às 06:17 de Brasília (09:17 UTC). Cada fonte segue a própria agenda (pasta fontes/);
    # as tentativas diárias de "tentar_ate_novidade_dias" também cabem aqui.
    # Para fontes que mudam ao longo do dia, volte para de hora em hora: '17 * * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Verificar todas as fontes agora (ignora a agenda)'
        type: boolean
        default: false
      fonte:
        description: 'Somente esta fonte (o id dela, nos arquivos da pasta fontes/)'
        required: false
      republicar:
        description: 'Republicar os sites mesmo sem mudança'
        type: boolean
        default: false

permissions:
  contents: write     # gravar bruto/, final/ e estado/
  issues: write       # avisos
  pages: write
  id-token: write

concurrency:
  group: automacao-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # até 3 h (o GitHub permite 6 h); a coleta usa até DD_PRAZO_MINUTOS e o que faltar continua na próxima execução
    outputs:
      publicar: ${{ steps.run.outputs.site_mudou == 'true' || inputs.republicar == true }}
    env:
      TZ: America/Sao_Paulo
      # Modo completo só quando os segredos existem; sem eles, modo simplificado (arquivo único automacao/automacao.mjs)
      MODO_COMPLETO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.APP_REPO_TOKEN != '' && vars.APP_REPO != '' }}
    steps:
      - name: Repositório de dados
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── Modo simplificado: coleta, histórico, tratamento, JSON final e avisos ──
      - name: Coletar e tratar (modo simplificado)
        if: env.MODO_COMPLETO != 'true'
        timeout-minutes: 170
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DD_PRAZO_MINUTOS: 150   # tempo de coleta por execução (ajuste aqui, se precisar)
          FORCAR: ${{ inputs.forcar }}
          FONTE: ${{ inputs.fonte }}
        run: |
          ARGS="--dados $GITHUB_WORKSPACE"
          if [ "$FORCAR" = "true" ]; then ARGS="$ARGS --forcar"; fi
          if [ -n "$FONTE" ]; then ARGS="$ARGS --fonte $FONTE"; fi
          node automacao/automacao.mjs $ARGS

      # ── Modo completo: também atualiza as bases do app e publica os sites ──
      - name: Código do app (repositório privado)
        if: env.MODO_COMPLETO == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - name: Instalar dependências do app
        if: env.MODO_COMPLETO == 'true'
        working-directory: app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Credenciais do Firebase
        if: env.MODO_COMPLETO == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Coletar, tratar, sincronizar e gerar os sites (modo completo)
        id: run
        if: env.MODO_COMPLETO == 'true'
        timeout-minutes: 170
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DD_PRAZO_MINUTOS: 150   # tempo de coleta por execução (ajuste aqui, se precisar)
          FORCAR: ${{ inputs.forcar }}
          FONTE: ${{ inputs.fonte }}
        run: |
          ARGS="--dados $GITHUB_WORKSPACE"
          if [ "$FORCAR" = "true" ]; then ARGS="$ARGS --forcar"; fi
          if [ -n "$FONTE" ]; then ARGS="$ARGS --fonte $FONTE"; fi
          cd app && npx tsx automation/run.ts $ARGS

      - name: Apagar credenciais
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

      # Roda SEMPRE, mesmo se a coleta for interrompida: o progresso (anos já processados) nunca se perde
      - name: Gravar bruto, final e estado no repositório
        if: always()
        run: |
          git config user.name "automacao-dados"
          git config user.email "automacao-dados@users.noreply.github.com"
          rm -f estado/*.tmp
          # Adiciona só as pastas que existem (uma pasta ausente fazia o Git recusar o comando inteiro)
          for pasta in bruto final estado referencias; do
            if [ -e "$pasta" ]; then git add "$pasta"; fi
          done
          if git diff --cached --quiet; then
            echo "Nada novo para gravar."
          else
            git commit -m "Dados atualizados em $(date '+%d/%m/%Y %H:%M')"
            # Se alguém editou o repositório durante a execução (ex.: fontes/), junta antes de enviar
            git pull --rebase --autostash
            git push
            echo "Gravado: $(git show --stat --oneline HEAD | tail -1)"
          fi

      - name: Preparar site para o GitHub Pages
        if: steps.run.outputs.site_mudou == 'true' || inputs.republicar == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Enviar ao servidor próprio (opcional)
        if: (steps.run.outputs.site_mudou == 'true' || inputs.republicar == true) && vars.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORTA: ${{ vars.DEPLOY_PORT || '22' }}
          USUARIO: ${{ vars.DEPLOY_USER }}
          DESTINO: ${{ vars.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$PORTA" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete --exclude index.html --exclude .nojekyll -e "ssh -i ~/.ssh/deploy -p $PORTA" site/ "$USUARIO@$HOST:$DESTINO/"
          rm -f ~/.ssh/deploy

  publicar-pages:
    needs: atualizar
    if: needs.atualizar.outputs.publicar == 'true' && vars.GITHUB_PAGES != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
